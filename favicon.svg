<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .bg { fill: #4E387E; }
    .ring { stroke: none; }
    .fg { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B111B; }
      .ring { stroke: #7CC0FF; stroke-width: 3; }
      .fg { fill: #E6EDF5; }
    }
  </style>
  <rect class="bg ring" x="2" y="2" width="60" height="60" rx="14" />
  <text class="fg" x="50%" y="53%" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.5">MC</text>
</svg>
